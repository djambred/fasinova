name: fasinova

x-app: &app
  build: { context: ., target: app }
  image: fasinova/app:${APP_VERSION:-dev}
  env_file: .env
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  app:
    <<: *app

  worker:
    <<: *app
    command: php artisan queue:work redis --queue=default --tries=3

  deployer:                       # satu-satunya yang memegang socket Docker rootless
    <<: *app
    command: php artisan queue:work redis --queue=deploy --tries=1 --timeout=1200
    user: "${RUNNER_UID}:${RUNNER_GID}"
    environment:
      DOCKER_HOST: unix:///run/user/${RUNNER_UID}/docker.sock
    volumes:
      - storage:/var/www/html/storage
      - /run/user/${RUNNER_UID}/docker.sock:/run/user/${RUNNER_UID}/docker.sock
      - /home/runner/apps:/home/runner/apps   # path sama di host & container
      - ${CADDY_SOCKET_DIR:-/run/fasinova}:/run/fasinova  # admin API Caddy (unix socket)

  scheduler:
    <<: *app
    command: php artisan schedule:work

  web:
    build: { context: ., target: web }
    image: fasinova/web:${APP_VERSION:-dev}
    ports: ["127.0.0.1:8080:80"]        # hanya untuk Caddy
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on: [app]
    restart: unless-stopped

  caddy:
    build: ./docker/caddy
    image: fasinova/caddy:${APP_VERSION:-dev}
    network_mode: host                        # meneruskan ke 127.0.0.1:<port karya> dan 127.0.0.1:8080
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      CADDY_TLS: ${CADDY_TLS:-cloudflare}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - caddy-data:/data
      - ${CADDY_SOCKET_DIR:-/run/fasinova}:/run/fasinova   # socket admin API; hanya `deployer` yang ikut me-mount
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s }
    restart: unless-stopped

volumes:
  storage:
  pg-data:
  redis-data:
  caddy-data:
